<svg width="830" height="190" viewBox="0 0 830 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect width="830" height="190" rx="12"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD9A6"/>
      <stop offset="35%" stop-color="#FFB7C5"/>
      <stop offset="70%" stop-color="#C4A7E7"/>
      <stop offset="100%" stop-color="#A5D8F3"/>
      <animate attributeName="x1" values="0;0.35;0" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.65;1" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .blob { mix-blend-mode: screen; }
    .b1 { animation: f1 19s ease-in-out infinite; }
    .b2 { animation: f2 23s ease-in-out infinite; }
    .b3 { animation: f3 27s ease-in-out infinite; }
    .b4 { animation: f4 21s ease-in-out infinite; }
    @keyframes f1 { 0%,100% { transform: translate(0,0)      } 50% { transform: translate(110px,26px) } }
    @keyframes f2 { 0%,100% { transform: translate(0,0)      } 50% { transform: translate(-90px,-22px) } }
    @keyframes f3 { 0%,100% { transform: translate(0,0)      } 50% { transform: translate(70px,-30px) } }
    @keyframes f4 { 0%,100% { transform: translate(0,0)      } 50% { transform: translate(-120px,18px) } }
    .caret { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  </style>

  <g clip-path="url(#card)">
    <rect width="830" height="190" fill="url(#base)"/>
    <g filter="url(#soft)" opacity="0.85">
      <ellipse class="blob b1" cx="120"  cy="45"  rx="170" ry="120" fill="#FFE3A8"/>
      <ellipse class="blob b2" cx="360"  cy="150" rx="180" ry="130" fill="#FFA8C4"/>
      <ellipse class="blob b3" cx="600"  cy="40"  rx="190" ry="125" fill="#BFA3ED"/>
      <ellipse class="blob b4" cx="790"  cy="140" rx="175" ry="120" fill="#96D4F5"/>
    </g>
    <rect width="830" height="190" fill="#ffffff" opacity="0.10"/>
  </g>

  <text x="415" y="96" text-anchor="middle" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="56" font-weight="700" fill="#2B2140">zexa</text>
  <rect class="caret" x="492" y="56" width="14" height="44" fill="#2B2140"/>
  <rect x="355" y="116" width="120" height="3" rx="1.5" fill="#2B2140" opacity="0.35"/>
  <text x="415" y="154" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#463A5C">用 Rust 造工具 · 用 AI 解问题 · 用全栈做产品</text>
</svg>
