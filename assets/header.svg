<svg width="830" height="190" viewBox="0 0 830 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect width="830" height="190" rx="12"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <!-- 色序每 830px 重复；承载它的 rect 每周期左移 830px，故首尾无缝 -->
    <linearGradient id="flow" x1="0" y1="0" x2="2490" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0"      stop-color="#FFD9A6"/>
      <stop offset="0.0833" stop-color="#FFB0C4"/>
      <stop offset="0.1667" stop-color="#C6A4EC"/>
      <stop offset="0.25"   stop-color="#9AD6F5"/>
      <stop offset="0.3333" stop-color="#FFD9A6"/>
      <stop offset="0.4167" stop-color="#FFB0C4"/>
      <stop offset="0.5"    stop-color="#C6A4EC"/>
      <stop offset="0.5833" stop-color="#9AD6F5"/>
      <stop offset="0.6667" stop-color="#FFD9A6"/>
      <stop offset="0.75"   stop-color="#FFB0C4"/>
      <stop offset="0.8333" stop-color="#C6A4EC"/>
      <stop offset="0.9167" stop-color="#9AD6F5"/>
      <stop offset="1"      stop-color="#FFD9A6"/>
    </linearGradient>
  </defs>

  <style>
    .flow { animation: slide 6s linear infinite; }
    @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-830px) } }
    .b1 { animation: f1 7s ease-in-out infinite; }
    .b2 { animation: f2 9s ease-in-out infinite; }
    .b3 { animation: f3 5s ease-in-out infinite; }
    @keyframes f1 { 0%,100% { transform: translate(-40px,-18px) } 50% { transform: translate(260px,26px) } }
    @keyframes f2 { 0%,100% { transform: translate(60px,24px)   } 50% { transform: translate(-240px,-20px) } }
    @keyframes f3 { 0%,100% { transform: translate(0,20px)      } 50% { transform: translate(190px,-26px) } }
    .caret { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  </style>

  <g clip-path="url(#card)">
    <rect class="flow" x="0" y="0" width="2490" height="190" fill="url(#flow)"/>
    <g filter="url(#soft)" opacity="0.5">
      <ellipse class="b1" cx="200" cy="40"  rx="150" ry="95"  fill="#FFF0C4"/>
      <ellipse class="b2" cx="560" cy="155" rx="160" ry="100" fill="#FF9EC0"/>
      <ellipse class="b3" cx="700" cy="35"  rx="150" ry="92"  fill="#B9E3FA"/>
    </g>
  </g>

  <text x="415" y="96" text-anchor="middle" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="56" font-weight="700" fill="#231A33">zexa</text>
  <rect class="caret" x="492" y="56" width="14" height="44" fill="#231A33"/>
  <rect x="355" y="116" width="120" height="3" rx="1.5" fill="#231A33" opacity="0.32"/>
  <text x="415" y="154" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#3E3252">用 Rust 造工具 · 用 AI 解问题 · 用全栈做产品</text>
</svg>
